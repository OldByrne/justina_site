<nav class="nav" [class.mobile-open]="mobileMenuOpen">
  <!-- Desktop sidebar -->
  <div class="nav-desktop">
    <div class="nav-logo">
      <img src="logo.png" alt="Justina Mazeikaite" class="logo-img">
    </div>

    <ul class="nav-links">
      @for (link of navLinks; track link.sectionId) {
        <li>
          <button
            class="nav-link"
            [class.active]="isActive(link.sectionId)"
            (click)="scrollTo(link.sectionId)"
          >
            {{ link.label }}
          </button>
        </li>
      }
    </ul>

    <div class="nav-footer">
      <a href="https://linkedin.com" target="_blank" rel="noopener" class="nav-footer-link" aria-label="LinkedIn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
          <rect x="2" y="9" width="4" height="12"/>
          <circle cx="4" cy="4" r="2"/>
        </svg>
      </a>
      <a href="mailto:hello@justina.design" class="nav-footer-link" aria-label="Email">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="M2 7l10 7 10-7"/>
        </svg>
      </a>
    </div>
  </div>

  <!-- Mobile header -->
  <div class="nav-mobile-header">
    <img src="logo.png" alt="Justina Mazeikaite" class="logo-img-mobile">
    <button class="hamburger" (click)="toggleMobileMenu()" [attr.aria-expanded]="mobileMenuOpen" aria-label="Toggle menu">
      @if (!mobileMenuOpen) {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      } @else {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      }
    </button>
  </div>

  <!-- Mobile menu overlay -->
  @if (mobileMenuOpen) {
    <div class="nav-mobile-menu">
      <ul class="nav-links-mobile">
        @for (link of navLinks; track link.sectionId) {
          <li>
            <button
              class="nav-link-mobile"
              [class.active]="isActive(link.sectionId)"
              (click)="scrollTo(link.sectionId)"
            >
              {{ link.label }}
            </button>
          </li>
        }
      </ul>
      <div class="nav-mobile-footer">
        <a href="https://linkedin.com" target="_blank" rel="noopener" aria-label="LinkedIn">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
            <rect x="2" y="9" width="4" height="12"/>
            <circle cx="4" cy="4" r="2"/>
          </svg>
        </a>
        <a href="mailto:hello@justina.design" aria-label="Email">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="M2 7l10 7 10-7"/>
          </svg>
        </a>
      </div>
    </div>
  }
</nav>
